version: 2
# Grouped monthly updates instead of one PR per transitive package.
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      bundler:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
